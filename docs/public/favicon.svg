<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#79c0ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="10" y="15" width="80" height="70" rx="12" fill="none" stroke="url(#grad)" stroke-width="5" filter="url(#glow)"/>
  <line x1="28" y1="38" x2="72" y2="38" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="52" x2="60" y2="52" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="28" y1="66" x2="52" y2="66" stroke="url(#grad)" stroke-width="4" stroke-linecap="round"/>
</svg>
